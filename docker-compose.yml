name: ${COMPOSE_PROJECT_NAME}

services:

  mysql:
    container_name: ${PROJECT_NAME}_mysql
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - mysql_data:/var/lib/mysql
    restart: "no"

  php:
    container_name: ${PROJECT_NAME}_php
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/zzz-xdebug.ini:ro
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PLACEHOLDER_PHOTO_PROVIDER: ${PLACEHOLDER_PHOTO_PROVIDER:-picsum}
    depends_on:
      - mysql
    restart: "no"

  nginx:
    container_name: ${PROJECT_NAME}_nginx
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_PORT:-127.0.0.1:80}:80"
      - "${NGINX_HTTPS_PORT:-127.0.0.1:443}:443"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/uploads-fallback.conf:/etc/nginx/uploads-fallback.conf:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - HTTPS_REDIRECT_BASE=${HTTPS_REDIRECT_BASE:-}
    depends_on:
      - php
    restart: "no"

volumes:
  mysql_data:
